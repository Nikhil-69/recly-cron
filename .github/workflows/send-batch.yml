name: send-batch
# Hits the Recly mail scheduler endpoint every ~10 minutes (batched sends).
# The endpoint URL and secret live in Actions secrets (CRON_URL, CRON_SECRET).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-batch
        run: |
          curl -fsS --max-time 180 "$CRON_URL" -H "x-cron-secret: $CRON_SECRET"
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
